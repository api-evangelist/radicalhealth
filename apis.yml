name: Radical Health
description: >-
  Radical Health is a Khosla Ventures-backed healthcare AI company that produces
  personalized, expert-reviewed cancer treatment reports for patients in the
  United States. Its platform ingests a patient's medical records and synthesizes
  oncology research, clinical trials, and prior patient outcomes into a tailored
  report within days, drawing on 5.3 million research papers, 11.8 million patient
  journeys, 20,000 treatment options, and 48,800+ active US clinical trials. The
  service pairs an always-on AI nurse navigator ("Alice") with human oncology
  oversight from institutions including UCLA, Johns Hopkins, Stanford, and Kaiser
  Permanente, and connects to 70,000+ US healthcare institutions (Epic, Kaiser,
  Ascension, HCA, Medicare) for records access. Reports are informational and
  educational only, not medical advice. Radical Health is HIPAA and SOC 2 Type II
  certified and operates as a consumer subscription product ($110/month with a
  7-day free trial); it does not currently publish a public developer API, SDK,
  or OpenAPI surface.
